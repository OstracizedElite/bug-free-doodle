[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pit"
version = "1.0.0"
description = "PIT — Predictive Intelligence Trading: deterministic XAU/USD forecasting and research platform (research and paper trading only)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "websocket-client>=1.8",
    "python-dotenv>=1.0",
    "streamlit>=1.36",
    "plotly>=5.22",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
pit = "pit.app.cli:main"

[tool.setuptools.packages.find]
include = ["pit*"]

[tool.setuptools.package-data]
pit = ["database/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: end-to-end tests that exercise several subsystems together",
]
filterwarnings = [
    "ignore::DeprecationWarning:streamlit.*",
]
